<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Living Brain, live</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #101315; color: #d7d9d4; font: 400 14px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
      html[data-theme="light"] { color-scheme: light; }
      html[data-theme="light"] body { background: #f3f4f6; color: #1a1a1a; }
      header { padding: 14px 16px 10px; }
      header h1 { margin: 0; font: 600 20px/1.2 "Libre Franklin Brand", system-ui, sans-serif; }
      header p { margin: 4px 0 0; opacity: 0.7; font-size: 13px; }
      #brain { position: relative; width: 100%; height: clamp(480px, 70vh, 820px); }
      #route { position: fixed; left: 16px; bottom: 16px; z-index: 50; padding: 6px 10px; border-radius: 6px; font: 500 13px/1.3 ui-monospace, Menlo, monospace;
        color: #0d1117; background: #2ec7a6; opacity: 0; transition: opacity 0.2s; }
      #route.on { opacity: 1; }
      main { padding: 12px 16px 40px; font-size: 13px; opacity: 0.75; }
    </style>
  </head>
  <body>
    <header><h1>Memory</h1><p>The tab's stage, as the site mounts it (this page stands in for the site's Memory tab).</p></header>
    <div id="brain"></div>
    <main>The Memory tab's tables sit here on the site, under the stage.</main>
    <div id="route" aria-live="polite"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
