<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stack, live</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101315; }
      #stack { position: absolute; inset: 0; }
      #route { position: absolute; left: 16px; top: 16px; z-index: 50; padding: 6px 10px; border-radius: 6px; font: 500 13px/1.3 ui-monospace, Menlo, monospace;
        color: #0d1117; background: #2ec7a6; opacity: 0; transition: opacity 0.2s; }
      #route.on { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="stack"></div>
    <div id="route" aria-live="polite"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
